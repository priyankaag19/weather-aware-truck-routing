# Render blueprint for the Django API. Deploy the frontend separately (Vercel/Netlify).
services:
  - type: web
    name: truck-weather-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn truckroute.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: truck-weather-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://YOUR-FRONTEND.vercel.app
      - key: HTTP_USER_AGENT
        value: weather-aware-truck-routing/1.0 (contact: you@example.com)
